serverinfo {
  name = "solanum-ci.invalid";
  sid = "42D";
  description = "Dancer CI Solanum";
  network_name = "DancerCI";
  default_max_clients = 64;
  nicklen = 30;
};

admin {
  name = "Dancer CI";
  description = "isolated test server";
  email = "<ci@example.invalid>";
};

class "users" {
  ping_time = 30 seconds;
  number_per_ident = 20;
  number_per_ip = 20;
  number_per_ip_global = 20;
  cidr_ipv4_bitlen = 24;
  cidr_ipv6_bitlen = 64;
  number_per_cidr = 20;
  max_number = 64;
  sendq = 100 kbytes;
};

listen {
  defer_accept = no;
  port = 6667;
};

auth {
  user = "*@*";
  class = "users";
};

channel {
  use_except = yes;
  use_invex = yes;
  use_forward = yes;
  use_knock = yes;
  knock_delay = 5 minutes;
  knock_delay_channel = 1 minute;
  max_chans_per_user = 20;
  max_bans = 60;
  max_bans_large = 500;
  default_split_user_count = 0;
  default_split_server_count = 0;
  no_create_on_split = no;
  no_join_on_split = no;
};

general {
  hide_error_messages = opers;
  default_umodes = "+i";
  default_operstring = "is an IRC operator";
  default_adminstring = "is a server administrator";
  servicestring = "is a network service";
  disable_fake_channels = no;
  min_nonwildcard = 4;
  min_nonwildcard_simple = 3;
  max_accept = 20;
  anti_nick_flood = no;
  max_nick_time = 20 seconds;
  max_nick_changes = 5;
  anti_spam_exit_message_time = 0 seconds;
  ts_warn_delta = 30 seconds;
  ts_max_delta = 5 minutes;
  client_exit = yes;
  collision_fnc = yes;
  dline_with_reason = yes;
  kline_with_reason = yes;
  kline_reason = "Connection banned";
  identify_service = "NickServ@services.int";
  identify_command = "IDENTIFY";
  non_redundant_klines = yes;
  warn_no_nline = yes;
  stats_e_disabled = no;
  stats_c_oper_only = no;
  stats_h_oper_only = no;
  stats_y_oper_only = no;
  stats_o_oper_only = no;
  stats_P_oper_only = no;
  stats_i_oper_only = no;
  stats_k_oper_only = no;
  map_oper_only = no;
  operspy_admin_only = no;
  caller_id_wait = 1 minute;
  pace_wait = 1 second;
  pace_wait_simple = 1 second;
  short_motd = no;
  ping_cookie = no;
  connect_timeout = 30 seconds;
  default_ident_timeout = 1 second;
  disable_auth = yes;
  throttle_duration = 1 second;
  throttle_count = 100;
  max_ratelimit_tokens = 100;
  away_interval = 0 seconds;
  certfp_method = sha256;
};

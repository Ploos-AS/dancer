name: Release OCI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ploos-as/dancer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/ploos-as/dancer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify published multi-platform manifest
        run: |
          set -e
          image="ghcr.io/ploos-as/dancer@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$image" > manifest.txt
          cat manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
          grep -q 'linux/arm/v7' manifest.txt
          grep -q 'linux/386' manifest.txt
      - name: Smoke-test published amd64 image
        run: |
          set -e
          image="ghcr.io/ploos-as/dancer@${{ steps.build.outputs.digest }}"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 'dancer:dancer'
          test "$(docker image inspect "$image" --format '{{.Config.StopSignal}}')" = 'SIGTERM'
          docker image inspect "$image" --format '{{json .Config.Healthcheck.Test}}' | grep -q '/proc/1/comm'

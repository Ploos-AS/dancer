name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate policy and Compose
        run: |
          test -f docs/OCI-POLICY.md
          grep -q "Alpine first" docs/OCI-POLICY.md
          cp .env.example .env
          docker compose config >/dev/null
      - name: Build Dancer on Alpine
        run: docker build --progress=plain -t dancer:m0 .
      - name: Verify runtime layout
        run: |
          id=$(docker create dancer:m0)
          docker export "$id" > rootfs.tar
          tar -tf rootfs.tar | grep -q '^usr/local/bin/dancer$'
          tar -tf rootfs.tar | grep -q '^data/dancer.config$'
          tar -tf rootfs.tar | grep -q '^data/dancer.users$'
          tar -tf rootfs.tar | grep -q '^data/dancer.funcs$'
          tar -tf rootfs.tar | grep -q '^data/dancer.explain$'
          docker rm "$id"
      - name: Probe Dancer startup semantics
        run: |
          set +e
          timeout 5s docker run --rm dancer:m0 >dancer-startup.log 2>&1
          rc=$?
          set -e
          cat dancer-startup.log
          echo "Dancer startup probe exit code: $rc"
          test "$rc" -ne 125

  multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Qualify amd64 and arm64 builds
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

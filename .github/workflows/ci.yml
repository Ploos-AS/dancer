name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate policy and Compose
        run: |
          test -f docs/OCI-POLICY.md
          grep -q "Alpine first" docs/OCI-POLICY.md
          test -f docs/UPSTREAM-COMPAT.md
          grep -Fq 'It is not a feature fork.' docs/UPSTREAM-COMPAT.md
          test -f docs/OBSERVABILITY.md
          grep -Fq '## Liveness versus readiness' docs/OBSERVABILITY.md
          test "$(grep -c "^[[:space:]]*&& sed -i " Dockerfile)" -eq 5
          unexpected="$(grep "^[[:space:]]*&& sed -i " Dockerfile | grep -Ev "(list\\.h|netstuff\\.c|netstuff\\.h)" || true)"
          test -z "$unexpected"
          cp .env.example .env
          docker compose config >/dev/null
      - name: Build Dancer on Alpine
        run: docker build --progress=plain -t dancer:m0 .
      - name: Verify runtime layout
        run: |
          id=$(docker create dancer:m0)
          docker export "$id" > rootfs.tar
          tar -tf rootfs.tar > rootfs.list
          grep -Fxq 'usr/local/bin/dancer' rootfs.list
          grep -Fxq 'data/dancer.config' rootfs.list
          grep -Fxq 'usr/local/bin/dancer-metrics' rootfs.list
          test "$(docker image inspect dancer:m0 --format '{{.Config.User}}')" = 'dancer:dancer'
          test "$(docker run --rm --entrypoint id dancer:m0 -u)" = '10001'
          docker rm "$id"
      - name: Verify configuration preflight failures
        run: |
          mkdir -p tests/preflight-empty
          set +e
          docker run --rm -v "$PWD/tests/preflight-empty:/data:ro" dancer:m0 >missing.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 64
          grep -Fq 'missing configuration: /data/dancer.config' missing.log
      - name: Verify healthcheck and graceful shutdown
        run: |
          docker image inspect dancer:m0 --format '{{json .Config.Healthcheck.Test}}' | grep -q '/proc/1/comm'
          # Graceful shutdown is qualified with a config that keeps Dancer alive
          # long enough to receive SIGTERM; the stock template is intentionally incomplete.
          mkdir -p tests/shutdown-config
          cp tests/irc/config/dancer.config tests/shutdown-config/dancer.config 2>/dev/null || {
            cid=$(docker create dancer:m0)
            docker cp "$cid:/usr/local/share/dancer/dancer.config" tests/shutdown-config/dancer.config
            docker rm "$cid" >/dev/null
          }
          sed -i -E 's/^[[:space:]]*#server[[:space:]]*=.*/server = 127.0.0.1:65534/' tests/shutdown-config/dancer.config
          sed -i -E 's/^[[:space:]]*#channel[[:space:]]*=.*/channel = #dancer-ci/' tests/shutdown-config/dancer.config
          sed -i -E 's/^[[:space:]]*#nick[[:space:]]*=.*/nick = dancer-ci/' tests/shutdown-config/dancer.config
          sudo chown -R 10001:10001 tests/shutdown-config
          id=$(docker run -d --network none -v "$PWD/tests/shutdown-config:/data:ro" -e DANCER_CONFIG_REFERENCE=/data/dancer.config dancer:m0)
          sleep 1
          if [ "$(docker inspect "$id" --format '{{.State.Running}}')" = "true" ]; then
            docker stop -t 3 "$id" >/dev/null
            test "$(docker inspect "$id" --format '{{.State.ExitCode}}')" -eq 0
          fi
          docker rm "$id" >/dev/null
          sudo rm -rf tests/shutdown-config
      - name: Run isolated IRC handshake
        run: |
          rm -rf tests/irc/config
          mkdir -p tests/irc/config
          cid=$(docker create dancer:m0)
          docker cp "$cid:/usr/local/share/dancer/." tests/irc/config/
          docker rm "$cid"
          awk 'BEGIN{done=0} !done && $0 ~ /^[[:space:]]*#?[[:space:]]*server[[:space:]]*=/ { $0="server = irc-test:6667"; done=1 } {print}' tests/irc/config/dancer.config > tests/irc/config/dancer.config.new
          mv tests/irc/config/dancer.config.new tests/irc/config/dancer.config
          sed -i -E 's|^[[:space:]]*#?[[:space:]]*channel[[:space:]]*=.*$|channel = #dancer-ci|' tests/irc/config/dancer.config
          sed -i -E 's|^[[:space:]]*#?[[:space:]]*nick[[:space:]]*=.*$|nick = dancer-ci|' tests/irc/config/dancer.config
          sudo chown -R 10001:10001 tests/irc/config
          docker network create dancer-m0-test
          trap 'docker rm -f irc-test dancer-m0-test-client >/dev/null 2>&1 || true; docker network rm dancer-m0-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name irc-test --network dancer-m0-test -v "$PWD/tests/irc/server.py:/server.py:ro" python:3-alpine python3 /server.py
          docker run -d --name dancer-m0-test-client --restart unless-stopped --network dancer-m0-test -v "$PWD/tests/irc/config:/data" dancer:m0
          ok=0
          for _ in $(seq 1 20); do
            if docker logs irc-test 2>&1 | grep -q 'DANCER_IRC_RECONNECT_OK'; then ok=1; break; fi
            sleep 1
          done
          test "$ok" -eq 1
          docker logs irc-test | grep -q 'DANCER_IRC_HANDSHAKE_OK'
          docker logs irc-test | grep -q 'DANCER_IRC_PING_PONG_OK'
          docker logs irc-test | grep -q 'DANCER_IRC_JOIN_OK'
          docker logs irc-test | grep -q 'DANCER_IRC_RECONNECT_OK'
      - name: Qualify readiness and Prometheus state tooling
        run: |
          chmod +x tools/dancer-readiness tools/dancer-readiness-watch tools/dancer-metrics
          state="$RUNNER_TEMP/dancer-ready"
          export DANCER_READY_STATE_FILE="$state"
          printf '%s\n' 'DANCER_IRC_CHANNEL_OK' | tools/dancer-readiness-watch
          tools/dancer-readiness
          tools/dancer-metrics > metrics.txt
          grep -Fxq 'dancer_irc_ready 1' metrics.txt
          grep -Fxq 'dancer_irc_channel_up 1' metrics.txt


  config-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Dancer image
        run: docker build --progress=plain -t dancer:config-ci .
      - name: Qualify config overlay against upstream example
        run: |
          chmod +x tools/dancer-config-overlay tests/config/overlay.sh
          tests/config/overlay.sh
      - name: Qualify config validator and generator
        run: |
          chmod +x tools/dancer-config-overlay tools/dancer-config-validate tools/dancer-config-generate
          chmod +x tests/config/validate.sh tests/config/generate.sh
          tests/config/validate.sh
          tests/config/generate.sh
      - name: Qualify optional Compose secrets profile
        run: |
          chmod +x tests/config/compose-secrets.sh
          tests/config/compose-secrets.sh

  ircd-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ircd: [ergo, inspircd, solanum]
    steps:
      - uses: actions/checkout@v4
      - name: Build Dancer
        run: docker build --progress=plain -t dancer:ircd-matrix .
      - name: Build Solanum CI image
        if: matrix.ircd == 'solanum'
        run: docker build --progress=plain -f tests/ircd/solanum.Dockerfile -t solanum:dancer-ci .
      - name: Qualify Dancer against ${{ matrix.ircd }}
        run: |
          chmod +x tests/ircd/qualify.sh
          tests/ircd/qualify.sh "${{ matrix.ircd }}"

  tls-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dancer for TLS qualification
        run: docker build --progress=plain -t dancer:tls-ci .
      - name: Validate TLS Compose isolation policy
        env:
          IRC_TLS_HOST: irc.example.invalid
        run: |
          chmod +x tests/tls/compose-profile.sh
          tests/tls/compose-profile.sh
      - name: Qualify external IRC readiness observer
        run: |
          chmod +x tools/dancer-readiness tools/dancer-readiness-watch tools/dancer-readiness-mark tools/dancer-irc-observer tests/irc/observer.sh
          tests/irc/observer.sh
      - name: Qualify readiness Compose boundaries
        env:
          DANCER_OBSERVER_HOST: irc.example.invalid
          DANCER_OBSERVER_CHANNEL: '#dancer-ci'
        run: |
          chmod +x tests/irc/readiness-compose.sh
          tests/irc/readiness-compose.sh
      - name: Qualify Prometheus metrics deployment
        run: |
          chmod +x tools/dancer-metrics deploy/readiness/metrics.sh tests/irc/metrics-deploy.sh
          tests/irc/metrics-deploy.sh
      - name: Qualify external TLS transport
        run: |
          chmod +x tests/tls/qualify.sh
          tests/tls/qualify.sh

  multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Qualify amd64 and arm64 builds
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

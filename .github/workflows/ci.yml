name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate policy and Compose
        run: |
          test -f docs/OCI-POLICY.md
          grep -q "Alpine first" docs/OCI-POLICY.md
          cp .env.example .env
          docker compose config >/dev/null
      - name: Build Dancer on Alpine
        run: docker build --progress=plain -t dancer:m0 .
      - name: Verify runtime layout
        run: |
          id=$(docker create dancer:m0)
          docker export "$id" > rootfs.tar
          tar -tf rootfs.tar > rootfs.list
          grep -Fxq 'usr/local/bin/dancer' rootfs.list
          grep -Fxq 'data/dancer.config' rootfs.list
          grep -Fxq 'data/dancer.users' rootfs.list
          grep -Fxq 'data/dancer.funcs' rootfs.list
          grep -Fxq 'data/dancer.explain' rootfs.list
          test "$(docker image inspect dancer:m0 --format '{{.Config.User}}')" = 'dancer:dancer'
          docker rm "$id"
      - name: Verify Dancer finds working-directory config
        run: |
          set +e
          timeout --kill-after=2s 5s docker run --rm --network none dancer:m0 >dancer-startup.log 2>&1
          rc=$?
          set -e
          cat dancer-startup.log
          echo "Dancer startup probe exit code: $rc"
          if grep -Fq "./dancer.config not found!" dancer-startup.log; then
            echo "Dancer failed to load /data/dancer.config" >&2
            exit 1
          fi
          case "$rc" in
            124|137) ;;
            *) echo "Dancer exited unexpectedly with code $rc" >&2; exit 1 ;;
          esac

  multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Qualify amd64 and arm64 builds
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

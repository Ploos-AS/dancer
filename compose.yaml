services:
  dancer:
    build:
      context: .
      args:
        DANCER_URL: ${DANCER_URL:?set DANCER_URL in .env}
        DANCER_SHA256: ${DANCER_SHA256:?set DANCER_SHA256 in .env}
    image: ${DANCER_IMAGE:-dancer:local}
    restart: unless-stopped
    user: "10001:10001"
    init: true
    volumes:
      - ./config:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DANCER_CONFIG_OVERLAY_FILE: /run/secrets/dancer_config_overlay
    secrets:
      - dancer_config_overlay

secrets:
  dancer_config_overlay:
    file: ${DANCER_CONFIG_OVERLAY_SOURCE:-./secrets/dancer-config-line}


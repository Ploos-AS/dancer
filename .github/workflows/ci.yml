  config-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Dancer image
        run: docker build --progress=plain -t dancer:config-ci .
      - name: Qualify config overlay against upstream example
        run: |
          chmod +x tools/dancer-config-overlay tests/config/overlay.sh
          tests/config/overlay.sh
      - name: Qualify config validator and generator
        run: |
          chmod +x tools/dancer-config-overlay tools/dancer-config-validate tools/dancer-config-generate
          chmod +x tests/config/validate.sh tests/config/generate.sh
          tests/config/validate.sh
          tests/config/generate.sh
      - name: Qualify optional Compose secrets profile
        run: |
          chmod +x tests/config/compose-secrets.sh
          tests/config/compose-secrets.sh

  ircd-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ircd: [ergo, inspircd, solanum]
    steps:
      - uses: actions/checkout@v4
      - name: Build Dancer
        run: docker build --progress=plain -t dancer:ircd-matrix .
      - name: Build Solanum CI image
        if: matrix.ircd == 'solanum'
        run: docker build --progress=plain -f tests/ircd/solanum.Dockerfile -t solanum:dancer-ci .
      - name: Qualify Dancer against ${{ matrix.ircd }}
        run: |
          chmod +x tests/ircd/qualify.sh
          tests/ircd/qualify.sh "${{ matrix.ircd }}"

  tls-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dancer for TLS qualification
        run: docker build --progress=plain -t dancer:tls-ci .
      - name: Validate TLS Compose isolation policy
        env:
          IRC_TLS_HOST: irc.example.invalid
        run: |
          chmod +x tests/tls/compose-profile.sh
          tests/tls/compose-profile.sh
      - name: Qualify external IRC readiness observer
        run: |
          chmod +x tools/dancer-readiness tools/dancer-readiness-watch tools/dancer-readiness-mark tools/dancer-irc-observer tests/irc/observer.sh
          tests/irc/observer.sh
      - name: Qualify external TLS transport
        run: |
          chmod +x tests/tls/qualify.sh
          tests/tls/qualify.sh

  multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Qualify amd64 and arm64 builds
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
